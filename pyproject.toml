[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemus-foundation"
version = "0.1.0"
description = "A from-scratch foundation-model research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "sentencepiece>=0.2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["datasets>=3.0", "huggingface_hub>=0.26", "pyarrow>=18.0"]

[project.scripts]
artemus-train = "artemis.train:main"
artemus-generate = "artemis.generate:main"
artemus-profile = "artemis.profile:main"
artemus-bench-kv-cache = "artemis.bench_kv_cache:main"
artemus-dialogue-eval = "artemis.dialogue_eval:main"
artemus-capability-eval = "artemis.capability_eval:main"
artemus-prepare-hf = "artemis.prepare_pretraining_data:main"
artemus-prepare-parquet = "artemis.prepare_parquet_shards:main"
artemus-lm-eval = "artemis.lm_eval:main"
artemus-prepare-aya = "artemis.prepare_aya:main"
artemus-prepare-mixture = "artemis.prepare_corpus_mixture:main"
artemus-prepare-oscr = "artemis.prepare_oscr_code:main"
artemus-teach = "artemis.teach:main"
artemus-prepare-teaching = "artemis.prepare_teaching_data:main"
artemus-prepare-s3-mix = "artemis.prepare_s3_mix:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
