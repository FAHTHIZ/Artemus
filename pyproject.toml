[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemus-foundation"
version = "0.1.0"
description = "A from-scratch foundation-model research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "sentencepiece>=0.2.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
artemus-train = "artemis.train:main"
artemus-generate = "artemis.generate:main"
artemus-profile = "artemis.profile:main"
artemus-bench-kv-cache = "artemis.bench_kv_cache:main"
artemus-dialogue-eval = "artemis.dialogue_eval:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
