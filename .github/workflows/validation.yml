name: Artemis validation

on:
  push:
    branches:
      - main
      - bootstrap/architecture
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artemis-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Run a deterministic training smoke test
        run: |
          artemus-train \
            --data examples/demo_corpus.txt \
            --steps 25 \
            --batch-size 4 \
            --block-size 32 \
            --layers 2 \
            --heads 2 \
            --embedding-size 32 \
            --eval-interval 5 \
            --eval-iters 2 \
            --seed 1337 \
            --device cpu \
            --output artifacts/artemis-ci-smoke.pt

      - name: Verify checkpoint can generate text
        run: |
          artemus-generate \
            --checkpoint artifacts/artemis-ci-smoke.pt \
            --prompt "Artemis" \
            --tokens 24 \
            --device cpu

      - name: Upload smoke-test checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artemis-ci-smoke-checkpoint
          path: artifacts/artemis-ci-smoke.pt
          if-no-files-found: ignore
          retention-days: 3
