name: Artemis validation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "examples/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "notebooks/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "examples/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "notebooks/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'probe Kaggle kernel status') && format('artemus-validation-probe-{0}', github.run_id) || format('artemus-validation-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and data-integrity tests
        run: pytest -q

      - name: Check Python syntax
        run: python -m compileall -q src tests

  foundation-training:
    needs: tests
    # Explicit one-time launcher: launch initial Artemus foundation run after correcting the embedded-Python heredoc test. Verify all bundle-builder Python blocks, package pinned offline inputs, attach the private dataset, train the model, and record exact parameter count and held-out results.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'launch initial Artemus foundation run')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_STATE_DATASET: ${{ vars.KAGGLE_STATE_DATASET || format('{0}/artemus-training-state', secrets.KAGGLE_USERNAME) }}
      KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG || 'artemus-continuous-training' }}
      KAGGLE_ACCELERATOR: NvidiaTeslaT4
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out Artemus
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Launch and verify the initial foundation-training cycle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle six
          for name in KAGGLE_USERNAME KAGGLE_KERNEL_SLUG; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub secret/variable: $name"
              exit 1
            fi
          done
          if [[ -z "${KAGGLE_API_TOKEN:-}" && -z "${KAGGLE_KEY:-}" ]]; then
            echo "::error::Set KAGGLE_API_TOKEN (recommended) or KAGGLE_KEY in GitHub Actions secrets."
            exit 1
          fi
          if [[ "$KAGGLE_KERNEL_SLUG" != "artemus-continuous-training" ]]; then
            echo "::error::KAGGLE_KERNEL_SLUG must be artemus-continuous-training."
            exit 1
          fi
          python kaggle_username.py
          export KAGGLE_USERNAME="$(cat .kaggle-username)"
          export KAGGLE_STATE_DATASET="$KAGGLE_USERNAME/artemus-training-state"
          {
            echo "KAGGLE_USERNAME=$KAGGLE_USERNAME"
            echo "KAGGLE_STATE_DATASET=$KAGGLE_STATE_DATASET"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.kaggle"
          if [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
            # Do not let an old legacy key hide a rejected API token during preflight.
            unset KAGGLE_KEY
          else
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path.home() / ".kaggle" / "kaggle.json"
          path.write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"],
              "key": os.environ["KAGGLE_KEY"],
          }), encoding="utf-8")
          path.chmod(0o600)
          PY
          fi
          echo "Validating Kaggle API credentials with the authenticated quota endpoint..."
          if ! kaggle quota; then
            echo "::error::Kaggle rejected the configured credentials. This check requires an authenticated account; a successful datasets list is not sufficient."
            exit 1
          fi
          echo "Kaggle authentication verified."

          export KAGGLE_INPUT_DATASET="$KAGGLE_USERNAME/artemus-training-inputs"
          {
            echo "KAGGLE_INPUT_DATASET=$KAGGLE_INPUT_DATASET"
          } >> "$GITHUB_ENV"

          # All code and training sources are prepared on this internet-connected
          # runner. Kaggle API-launched notebooks may not have outbound DNS/network.
          bash scripts/prepare-kaggle-input-bundle.sh .kaggle-input-bundle .kaggle-prepared-inputs

          mkdir -p .kaggle-input-existing
          if kaggle datasets metadata "$KAGGLE_INPUT_DATASET" -p .kaggle-input-existing; then
            echo "Updating private offline training input dataset."
            kaggle datasets version \
              -p .kaggle-input-bundle \
              -m "Artemus offline inputs for $GITHUB_SHA" \
              --dir-mode zip
          else
            echo "Creating private offline training input dataset."
            kaggle datasets create \
              -p .kaggle-input-bundle \
              -q \
              --dir-mode zip
          fi
          mkdir -p .kaggle-input-verified
          input_verified=0
          for attempt in $(seq 1 20); do
            if kaggle datasets metadata "$KAGGLE_INPUT_DATASET" -p .kaggle-input-verified; then
              input_verified=1
              break
            fi
            echo "::notice::Kaggle is still creating or indexing the private input dataset (attempt $attempt/20)."
            sleep 15
          done
          if [[ "$input_verified" -ne 1 ]]; then
            echo "::error::Kaggle did not expose the private offline input dataset metadata after creation."
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(
              Path(".kaggle-input-verified/dataset-metadata.json").read_text(encoding="utf-8")
          )
          expected = os.environ["KAGGLE_INPUT_DATASET"]
          if metadata.get("id") != expected:
              raise SystemExit(
                  f"Offline training input dataset ID mismatch: expected {expected!r}, got {metadata.get('id')!r}"
              )
          print("Private offline dataset is visible and ready:", expected)
          PY
          echo "Verified offline input dataset: $KAGGLE_INPUT_DATASET"

          if kaggle datasets metadata "$KAGGLE_STATE_DATASET" -p .kaggle-state-existing; then
            export KAGGLE_STATE_DATASET_EXISTS=true
          else
            export KAGGLE_STATE_DATASET_EXISTS=false
          fi
          echo "KAGGLE_STATE_DATASET_EXISTS=$KAGGLE_STATE_DATASET_EXISTS" >> "$GITHUB_ENV"
          export KAGGLE_KERNEL_ID="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          mkdir -p .kaggle-kernel
          cp notebooks/kaggle-gpu-training.ipynb .kaggle-kernel/
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "id": os.environ["KAGGLE_USERNAME"] + "/" + os.environ["KAGGLE_KERNEL_SLUG"],
              "title": "Artemus continuous training",
              "code_file": "kaggle-gpu-training.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": os.environ["KAGGLE_ACCELERATOR"],
              "dataset_sources": (
                  [os.environ["KAGGLE_INPUT_DATASET"]]
                  + ([os.environ["KAGGLE_STATE_DATASET"]] if os.environ.get("KAGGLE_STATE_DATASET_EXISTS") == "true" else [])
              ),
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          Path(".kaggle-kernel/kernel-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          PY
          python -m json.tool .kaggle-kernel/kernel-metadata.json >/dev/null
          kaggle kernels push -p .kaggle-kernel --timeout 14400 --accelerator "$KAGGLE_ACCELERATOR"
          completed=0
          for attempt in $(seq 1 240); do
            status="$(kaggle kernels status "$KAGGLE_KERNEL_ID" 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eqi 'COMPLETE|SUCCEEDED' <<<"$status"; then completed=1; break; fi
            if grep -Eqi 'ERROR|FAILED|CANCELLED' <<<"$status"; then
              kaggle kernels logs "$KAGGLE_KERNEL_ID" || true
              echo "::error::Kaggle training did not complete successfully."
              exit 1
            fi
            sleep 60
          done
          if [[ "$completed" -ne 1 ]]; then
            kaggle kernels logs "$KAGGLE_KERNEL_ID" || true
            echo "::error::Timed out waiting for Kaggle training."
            exit 1
          fi
          mkdir -p kaggle-output verified-run
          kaggle kernels output "$KAGGLE_KERNEL_ID" -p kaggle-output --force
          mapfile -t archives < <(find kaggle-output -type f -name 'artemus-run-*.zip' | sort)
          if [[ "${#archives[@]}" -lt 1 ]]; then
            echo "::error::Kaggle completed without an Artemus run archive."
            exit 1
          fi
          unzip -q "${archives[-1]}" -d verified-run
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("verified-run")
          manifest = json.loads((root / "export-manifest.json").read_text(encoding="utf-8"))
          metadata = json.loads((root / "run-metadata.json").read_text(encoding="utf-8"))
          count = 0
          for item in manifest.get("artifacts", []):
              artifact = root / item["path"]
              if not artifact.is_file():
                  raise SystemExit(f"Missing artifact: {item['path']}")
              if hashlib.sha256(artifact.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {item['path']}")
              count += 1
          required = (
              "artemus-foundation-fineweb-edu.pt",
              "artemus-aya-instruction-sft.pt",
              "artemus-task-sft.pt",
              "tokenizer.model",
              "capability-evaluation-summary.json",
              "capability-evaluation-comparison.json",
              "model-size.json",
          )
          for filename in required:
              path = root / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required training artifact is missing: {filename}")
          if metadata.get("final_checkpoint") != "artemus-task-sft.pt":
              raise SystemExit("Run metadata does not identify the task-SFT candidate as final.")
          size_report = json.loads((root / "model-size.json").read_text(encoding="utf-8"))
          if not isinstance(size_report.get("model_parameters"), int) or size_report["model_parameters"] < 1:
              raise SystemExit("Model-size report does not contain a positive exact parameter count.")
          if size_report.get("model_parameters") != metadata.get("model_parameters"):
              raise SystemExit("Model-size report parameter count does not match run metadata.")
          if size_report.get("final_checkpoint_bytes", 0) < 1:
              raise SystemExit("Model-size report does not contain the final checkpoint byte size.")
          if size_report.get("cpu_fallback") not in (True, False):
              raise SystemExit("Model-size report does not identify the compute mode.")
          summary = json.loads((root / "capability-evaluation-summary.json").read_text(encoding="utf-8"))
          if summary.get("checkpoint_sha256") != metadata.get("checkpoint_sha256"):
              raise SystemExit("Capability evaluation was not run against the exported final checkpoint.")
          if summary.get("math", {}).get("evaluated", 0) < 1:
              raise SystemExit("Capability evaluation contains no scored math examples.")
          if summary.get("python", {}).get("evaluated", 0) < 1:
              raise SystemExit("Capability evaluation contains no scored Python examples.")
          comparison = json.loads((root / "capability-evaluation-comparison.json").read_text(encoding="utf-8"))
          if comparison.get("evaluation_data_sha256") != summary.get("evaluation_data_sha256"):
              raise SystemExit("Stage comparison used different evaluation data.")
          if set(comparison.get("stages", {})) != {"foundation", "aya", "task-sft"}:
              raise SystemExit("Stage comparison is missing one or more training checkpoints.")
          print(json.dumps({
              "training_cycle": metadata.get("training_cycle"),
              "repository_commit": metadata.get("repository_commit"),
              "global_step": metadata.get("global_step"),
              "verified_artifact_count": count,
              "checkpoint_sha256": metadata.get("checkpoint_sha256"),
          }, indent=2))
          if count == 0:
              raise SystemExit("No exported artifacts were verified")
          PY

      - name: Preserve the verified training outputs
        uses: actions/upload-artifact@v4
        with:
          name: artemus-initial-training-${{ github.run_id }}
          path: verified-run/
          if-no-files-found: error
          retention-days: 90

      - name: Version the private persistent training state
        id: persist-state
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kaggle-state-update/current-provenance
          python - <<'PY'
          import json, os
          from pathlib import Path
          dataset_id = os.environ["KAGGLE_STATE_DATASET"]
          metadata = {
              "title": "Artemus Training State",
              "id": dataset_id,
              "licenses": [{"name": "other"}],
              "description": "Private, resumable foundation checkpoint and provenance for Artemus research cycles. Keep private.",
          }
          root = Path("kaggle-state-update")
          (root / "dataset-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          (root / "README.md").write_text(
              "# Artemus private training state\n\n"
              "Foundation checkpoint, tokenizer, run metadata, manifests, and hashes. Keep private.\n",
              encoding="utf-8",
          )
          PY
          cp verified-run/artemus-foundation-fineweb-edu.pt kaggle-state-update/artemus-foundation-current.pt
          cp verified-run/artemus-aya-instruction-sft.pt kaggle-state-update/artemus-latest-aya.pt
          cp verified-run/artemus-task-sft.pt kaggle-state-update/artemus-latest-instruction.pt
          cp verified-run/tokenizer.model kaggle-state-update/tokenizer.model
          cp verified-run/run-metadata.json kaggle-state-update/run-metadata.json
          cp verified-run/model-size.json kaggle-state-update/model-size.json
          cp verified-run/export-manifest.json kaggle-state-update/export-manifest.json
          find verified-run -maxdepth 1 -type f \
            \( -name '*-manifest.json' -o -name '*-provenance.jsonl' \) \
            -exec cp {} kaggle-state-update/current-provenance/ \;
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path("kaggle-state-update")
          checkpoint = root / "artemus-foundation-current.pt"
          tokenizer = root / "tokenizer.model"
          metadata = json.loads((root / "run-metadata.json").read_text(encoding="utf-8"))
          foundation_sha256 = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          foundation_global_step = metadata.get("foundation_global_step")
          foundation_run_count = metadata.get("foundation_training_run_count")
          training_cycle = metadata.get("training_cycle")
          if metadata.get("foundation_checkpoint_sha256") != foundation_sha256:
              raise SystemExit("Foundation checkpoint hash does not match run metadata.")
          if not isinstance(foundation_global_step, int) or foundation_global_step < 1:
              raise SystemExit("Run metadata does not contain a valid foundation checkpoint step.")
          if foundation_run_count != training_cycle:
              raise SystemExit("Foundation checkpoint run count does not match the training cycle.")
          state = {
              "schema_version": 1,
              "updated_at_utc": datetime.now(timezone.utc).isoformat(),
              "training_cycle": training_cycle,
              "repository_commit": metadata.get("repository_commit"),
              "foundation_checkpoint": checkpoint.name,
              "foundation_checkpoint_sha256": foundation_sha256,
              "tokenizer_sha256": hashlib.sha256(tokenizer.read_bytes()).hexdigest(),
              "global_step": foundation_global_step,
              "foundation_global_step": foundation_global_step,
              "final_candidate_global_step": metadata.get("final_candidate_global_step", metadata.get("global_step")),
              "final_candidate_checkpoint": metadata.get("final_checkpoint"),
              "final_candidate_sha256": metadata.get("checkpoint_sha256"),
              "note": "Private state only. The next cycle resumes this foundation checkpoint, not the instruction-SFT candidate.",
          }
          (root / "state.json").write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(state, indent=2))
          PY
          if kaggle datasets metadata "$KAGGLE_STATE_DATASET" -p .kaggle-state-existing; then
            echo "Updating existing private checkpoint dataset."
            kaggle datasets version \
              -p kaggle-state-update \
              -m "Artemus training cycle $GITHUB_RUN_NUMBER" \
              --dir-mode zip
          else
            echo "Creating the private checkpoint dataset after preserving the GitHub artifact."
            kaggle datasets create \
              -p kaggle-state-update \
              -q \
              --dir-mode zip
          fi

      - name: Report first-run persistence status
        if: always()
        shell: bash
        run: |
          {
            echo "## Artemus first GPU run"
            echo "- Kaggle notebook submission and training steps are shown above."
            echo "- Verified outputs are stored as a GitHub Actions artifact (90-day retention)."
            if [[ "${{ steps.persist-state.outcome }}" == "success" ]]; then
              echo "- Private Kaggle resume dataset was created or updated successfully."
            else
              echo "- Private Kaggle resume dataset was not updated. The verified GitHub artifact is preserved; fix the Kaggle owner/account issue before recurring resume runs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  kaggle-status-probe:
    needs: tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'probe Kaggle kernel status')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG || 'artemus-continuous-training' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle six

      - name: Authenticate and inspect the running Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          python kaggle_username.py
          export KAGGLE_USERNAME="$(cat .kaggle-username)"
          if [[ "$KAGGLE_KERNEL_SLUG" != "artemus-continuous-training" ]]; then
            echo "::error::Unexpected Kaggle kernel slug."
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          if [[ -n "${KAGGLE_API_TOKEN:-}" ]]; then
            printf '%s' "$KAGGLE_API_TOKEN" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
            unset KAGGLE_KEY
          else
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path.home() / ".kaggle" / "kaggle.json"
          path.write_text(json.dumps({
              "username": os.environ["KAGGLE_USERNAME"],
              "key": os.environ["KAGGLE_KEY"],
          }), encoding="utf-8")
          path.chmod(0o600)
          PY
          fi
          kaggle quota
          kernel_id="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          for attempt in $(seq 1 12); do
            status="$(kaggle kernels status "$kernel_id" 2>&1)" || true
            echo "$status"
            if grep -Eqi 'RUNNING|QUEUED|PENDING' <<<"$status"; then
              echo "::notice::Kaggle accepted the Artemus kernel; current state is shown above."
              {
                echo "## Artemus Kaggle kernel status"
                echo "- Kernel: $kernel_id"
                echo "- Status: $status"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if grep -Eqi 'COMPLETE|SUCCEEDED' <<<"$status"; then
              echo "::notice::Kaggle kernel has completed."
              {
                echo "## Artemus Kaggle kernel status"
                echo "- Kernel: $kernel_id"
                echo "- Status: $status"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if grep -Eqi 'ERROR|FAILED|CANCELLED' <<<"$status"; then
              kaggle kernels logs "$kernel_id" || true
              echo "::error::Kaggle reports a failed or cancelled kernel."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Kaggle did not report a known kernel state within four minutes."
          exit 1
