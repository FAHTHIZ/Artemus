name: Artemis historical task-SFT continuation and dialogue health check

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Completed prior run containing a checkpoint artifact (or latest)"
        required: false
        default: latest
        type: string
      additional_steps:
        description: "Additional CPU task-SFT optimizer steps (capped at 16k for this dataset version)"
        required: false
        default: "8000"
        type: string
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: artemis-capability-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      GH_TOKEN: ${{ github.token }}
      ADDITIONAL_STEPS: ${{ inputs.additional_steps || '8000' }}
      REQUESTED_RESUME_RUN_ID: ${{ inputs.resume_run_id || 'latest' }}
      MAX_STEPS_ON_DATASET_VERSION: "16000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and data-integrity tests
        run: pytest -q

      - name: Download pinned, licensed training sources
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/datasets/OpenAssistant/oasst1/resolve/a4992e1595393714c9e6c567b1ed645bbf7d00ee/2023-04-12_oasst_ready.messages.jsonl.gz" \
            --output data/raw/oasst1-ready.messages.jsonl.gz
          echo "286a6e9a5a413b3272ae9c0b5a20d327983dea1c24342ae28cb244a6da65185c  data/raw/oasst1-ready.messages.jsonl.gz" | sha256sum --check

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/openai/grade-school-math/3101c7d5072418e28b9008a6636bde82a006892c/grade_school_math/data/train.jsonl" \
            --output data/raw/gsm8k-train.jsonl
          echo "17f347dc51477c50d4efb83959dbb7c56297aba886e5544ee2aaed3024813465  data/raw/gsm8k-train.jsonl" | sha256sum --check

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/google-research/google-research/83f1e7b59e762648c953de751d31f75720683622/mbpp/mbpp.jsonl" \
            --output data/raw/mbpp-full.jsonl
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path("data/raw/mbpp-full.jsonl").read_bytes()
          header = b"blob " + str(len(raw)).encode("ascii") + bytes([0])
          actual = hashlib.sha1(header + raw).hexdigest()
          expected = "96e2dc2f7dd95b7b87b38dc46e42cbed444251bb"
          if actual != expected:
              raise SystemExit(f"MBPP Git blob SHA mismatch: {actual} != {expected}")
          print(f"MBPP pinned Git blob verified: {actual}")
          PY

      - name: Filter and group-split OASST1 conversations
        run: |
          python -m artemis.prepare_oasst1 \
            --source data/raw/oasst1-ready.messages.jsonl.gz \
            --output-dir artifacts/oasst1 \
            --max-examples 30000

      - name: Build OASST1, GSM8K, and MBPP task mixture
        run: |
          python -m artemis.prepare_capability_data \
            --oasst-train artifacts/oasst1/train.txt \
            --oasst-validation artifacts/oasst1/validation.txt \
            --gsm8k-train data/raw/gsm8k-train.jsonl \
            --mbpp-full data/raw/mbpp-full.jsonl \
            --output-dir artifacts/capability-mixture

      - name: Resolve newest completed run containing a checkpoint artifact
        id: previous
        shell: bash
        run: |
          if [[ "$REQUESTED_RESUME_RUN_ID" == "latest" ]]; then
            RUN_ID=""
            while IFS= read -r CANDIDATE; do
              ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE}/artifacts" \
                --jq '.artifacts[]? | select(.name == "artemis-capability-mix-compact-cpu-run" and .expired == false) | .id' \
                | head -n 1)"
              if [[ -n "$ARTIFACT_ID" ]]; then
                RUN_ID="$CANDIDATE"
                echo "Selected run $RUN_ID with checkpoint artifact $ARTIFACT_ID"
                break
              fi
            done < <(gh run list \
              --workflow capability-training.yml \
              --branch main \
              --status completed \
              --json databaseId \
              --limit 20 --jq '.[].databaseId')
          else
            RUN_ID="$REQUESTED_RESUME_RUN_ID"
          fi
          if [[ -z "$RUN_ID" || ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No completed run with a usable checkpoint artifact was found." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using completed workflow run $RUN_ID containing a verified checkpoint artifact"

      - name: Download prior Artemis checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: artemis-capability-mix-compact-cpu-run
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}
          path: artifacts/resume

      - name: Verify prior checkpoint and calculate next global step
        id: checkpoint
        run: |
          CHECKPOINT="artifacts/resume/artemis-capability-mix-compact.pt"
          test -s "$CHECKPOINT"
          python - <<'PY'
          import torch
          path = "artifacts/resume/artemis-capability-mix-compact.pt"
          payload = torch.load(path, map_location="cpu", weights_only=True)
          if payload.get("format_version") != 3:
              raise SystemExit("Only provenance-enabled checkpoint format v3 may continue.")
          metadata = payload.get("run_metadata") or {}
          if metadata.get("lineage", {}).get("origin") != "random_initialization":
              raise SystemExit("Checkpoint lineage is not verified as random initialization.")
          if not metadata.get("runs"):
              raise SystemExit("Checkpoint is missing run metadata.")
          if payload.get("response_only") is not True:
              raise SystemExit("Expected a response-only task-SFT checkpoint.")
          print(f"checkpoint_step={payload['step']}")
          print(f"checkpoint_format={payload['format_version']}")
          print(f"parent_data_hash={metadata['runs'][-1].get('train_text_sha256')}")
          with open("artifacts/resume/checkpoint-step.txt", "w") as stream:
              stream.write(str(int(payload["step"])))
          PY
          START_STEP="$(cat artifacts/resume/checkpoint-step.txt)"
          if [[ ! "$ADDITIONAL_STEPS" =~ ^[0-9]+$ ]] || (( ADDITIONAL_STEPS < 1 )); then
            echo "additional_steps must be a positive integer" >&2
            exit 1
          fi
          if (( START_STEP >= MAX_STEPS_ON_DATASET_VERSION )); then
            mkdir -p artifacts
            cp "$CHECKPOINT" artifacts/artemis-capability-mix-compact.pt
            TARGET_STEP="$START_STEP"
            SHOULD_TRAIN="false"
            echo "This exact data mixture has reached its $MAX_STEPS_ON_DATASET_VERSION-step budget."
            echo "The checkpoint will still receive the scheduled multi-turn conversation evaluation."
          else
            TARGET_STEP=$((START_STEP + ADDITIONAL_STEPS))
            if (( TARGET_STEP > MAX_STEPS_ON_DATASET_VERSION )); then
              TARGET_STEP="$MAX_STEPS_ON_DATASET_VERSION"
            fi
            SHOULD_TRAIN="true"
            echo "Continuing from step $START_STEP to step $TARGET_STEP"
          fi
          echo "target_step=$TARGET_STEP" >> "$GITHUB_OUTPUT"
          echo "should_train=$SHOULD_TRAIN" >> "$GITHUB_OUTPUT"

      - name: Continue the same Artemis model with verified data lineage
        if: steps.checkpoint.outputs.should_train == 'true'
        run: |
          artemus-train \
            --data artifacts/capability-mixture/train.txt \
            --validation-data artifacts/capability-mixture/validation.txt \
            --data-manifest artifacts/capability-mixture/manifest.json \
            --resume artifacts/resume/artemis-capability-mix-compact.pt \
            --phase task_sft \
            --tokenizer sentencepiece \
            --response-only \
            --override-resume-learning-rate \
            --lr-schedule cosine \
            --learning-rate 0.0001 \
            --min-learning-rate 0.00001 \
            --warmup-steps 200 \
            --steps ${{ steps.checkpoint.outputs.target_step }} \
            --batch-size 8 \
            --block-size 256 \
            --layers 4 \
            --heads 4 \
            --embedding-size 128 \
            --embedding-dim 64 \
            --kv-heads 2 \
            --use-rope \
            --use-qk-norm \
            --use-swiglu \
            --eval-interval 250 \
            --eval-iters 8 \
            --seed 1337 \
            --device cpu \
            --output artifacts/artemis-capability-mix-compact.pt

      - name: Run scripted multi-turn conversations across capabilities
        run: |
          artemus-dialogue-eval \
            --checkpoint artifacts/artemis-capability-mix-compact.pt \
            --scenarios data/evaluation/dialogues.jsonl \
            --output-dir artifacts/dialogue-eval \
            --max-new-tokens 64 \
            --top-k 1 \
            --temperature 1.0 \
            --seed 1337 \
            --device cpu
          cat artifacts/dialogue-eval/summary.json

      - name: Inspect math and coding checkpoint samples
        run: |
          artemus-generate \
            --checkpoint artifacts/artemis-capability-mix-compact.pt \
            --prompt $'<|prompter|>\nA shop sells 3 pens for $6. What is the price of 5 pens at the same rate?\n<|assistant|>\n' \
            --tokens 80 --top-k 1 --device cpu
          artemus-generate \
            --checkpoint artifacts/artemis-capability-mix-compact.pt \
            --prompt $'<|prompter|>\nWrite a Python function that adds two numbers.\n<|assistant|>\n' \
            --tokens 80 --top-k 1 --device cpu

      - name: Upload checkpoint, provenance, and dialogue traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artemis-capability-mix-compact-cpu-run
          path: |
            artifacts/artemis-capability-mix-compact.pt
            artifacts/capability-mixture/manifest.json
            artifacts/oasst1/manifest.json
            artifacts/dialogue-eval/
          if-no-files-found: warn
          retention-days: 14
