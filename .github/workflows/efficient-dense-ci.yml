name: Artemis efficient architecture tests

on:
  push:
    branches:
      - research/efficient-dense-v2
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/efficient-dense-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/efficient-dense-ci.yml"

permissions:
  contents: read

concurrency:
  group: artemis-efficient-dense-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit and architecture tests
        run: pytest -q
      - name: Run GQA, RoPE, QK norm, and SwiGLU training smoke test
        run: |
          artemus-train \
            --data examples/demo_corpus.txt \
            --steps 10 \
            --batch-size 4 \
            --block-size 32 \
            --layers 2 \
            --heads 4 \
            --kv-heads 2 \
            --embedding-size 64 \
            --embedding-dim 32 \
            --use-rope \
            --use-qk-norm \
            --use-swiglu \
            --eval-interval 5 \
            --eval-iters 2 \
            --device cpu \
            --output artifacts/efficient-dense-smoke.pt

      - name: Profile compact GQA model parameters and theoretical KV cache
        run: |
          artemus-profile \
            --vocab-size 4096 \
            --block-size 256 \
            --layers 4 \
            --heads 4 \
            --kv-heads 2 \
            --embedding-size 128 \
            --embedding-dim 64 \
            --rope --qk-norm --swiglu \
            --batch-size 1 \
            --context-length 256 \
            --dtype-bytes 2

      - name: Profile the legacy dense baseline at the same width and vocabulary
        run: |
          artemus-profile \
            --vocab-size 4096 \
            --block-size 256 \
            --layers 4 \
            --heads 4 \
            --embedding-size 128 \
            --batch-size 1 \
            --context-length 256 \
            --dtype-bytes 2
